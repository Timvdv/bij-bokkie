name: Deploy to TransIP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-transip
  cancel-in-progress: true

jobs:
  export-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and export static site
        run: npm run export

      - name: Upload to TransIP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TRANSIP_FTP_HOST }}
          username: ${{ secrets.TRANSIP_FTP_USER }}
          password: ${{ secrets.TRANSIP_FTP_PASSWORD }}
          source: "out/**"
          target: /data/sites/web/bijbokkienl/www
          rm: true
