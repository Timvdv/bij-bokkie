name: Deploy to TransIP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-transip
  cancel-in-progress: true

jobs:
  export-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and export static site
        run: npm run export

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload to TransIP via SFTP (rsync)
        env:
          SSHPASS: ${{ secrets.TRANSIP_FTP_PASSWORD }}
        run: sshpass -e rsync -az --delete -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" ./out/ ${{ secrets.TRANSIP_FTP_USER }}@${{ secrets.TRANSIP_FTP_HOST }}:/www/
